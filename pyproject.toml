[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 200
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data",
    "logs",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort (import sorting)
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = ["."]

[tool.sqlfluff.core]
dialect = "duckdb"
templater = "raw"
max_line_length = 100

[tool.sqlfluff.indentation]
tab_space_size = 4
indent_unit = "space"

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.functions]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.aliasing.table]
aliasing_policy = "explicit"

[tool.sqlfluff.rules.aliasing.column]
aliasing_policy = "explicit"