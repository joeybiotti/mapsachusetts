[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data",
    "logs",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort (import sorting)
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = ["."]